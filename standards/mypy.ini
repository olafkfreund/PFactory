; Factory fleet shared mypy baseline (single source of truth).
; Per-service configs MUST inherit these and may only TIGHTEN.
; See standards/coding-standards.md section 1.2.

[mypy]
; The pydantic plugin teaches mypy that a model field with a default is optional
; in the constructor. Without it every `Model(a=1)` reports one
; `Missing named argument` per unset field, which is not a real defect and is
; not fixable in the calling code — the only "fix" would be passing every field
; explicitly, i.e. writing worse code to satisfy a tool.
;
; Measured on PFactory before adding it (mypy 1.20.1, pydantic 2.13.4):
;   apps/web-server/server        1120 -> 1041 errors
;   server/routes/settings.py      148 ->   80  (68 of them this one class)
; The highest-density files in PFactory#468 are mostly this, so the staged
; cleanup that issue plans is blocked on it.
;
; Requires pydantic importable wherever mypy runs. Every service in the fleet is
; a pydantic app and CI installs its requirements before the ratchet, so this
; holds — but if it ever stops holding mypy fails to start rather than reporting
; clean, which is the right direction (PFactory#466 was the opposite).
plugins = pydantic.mypy
python_version = 3.11
strict = True
; strict implies the following; spelled out so the contract is visible and a
; service cannot quietly weaken one of them:
disallow_untyped_defs = True
disallow_any_generics = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
no_implicit_reexport = True
; Boundaries must be typed (section 1.7); surface Any leaks rather than hide them.
disallow_subclassing_any = True
extra_checks = True
