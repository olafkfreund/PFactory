# Test files in THIS repo that sit outside the paths CI collects.
#
# Read by `scripts/check_test_collection.py`, fetched from the hub at the pin in
# .github/workflows/test-collection.yml. Factory#844 / #846.
#
# THIS FILE IS NOT AN IGNORE LIST. The gate enforces four rules:
#
#   * An entry matching NOTHING fails the gate (Factory#788). When a file
#     becomes collected, its entry must be deleted in the same PR, so this list
#     can only ratchet down.
#   * `reason` is validated -- placeholders (TODO, TBD, N/A, none, ...) and
#     one-liners are rejected.
#   * `issue` is REQUIRED. An uncollected test with no issue is a decision
#     nobody made.
#   * Exact paths only, no globs. A glob is how one entry quietly comes to
#     cover files nobody weighed.

[[allow]]
path = "apps/backend/agents/test_refactoring.py"
reason = """
Collecting this would turn `dev` red on a KNOWN-OPEN defect rather than on a \
regression. All four of its tests fail today, and they fail correctly: they \
assert `hasattr(coder, "run_autonomous_agent")` and that the name is in the \
package's public API, and that function is defined NOWHERE in this repo. \
That is PFactory#607, and this file is the evidence Factory#844 opened with -- \
"a test asserting exactly this property exists" and has never run. \
Whether PFactory should carry a coder at all is the scope question on #607; \
until it is answered there is no code change here that makes this file green, \
and wiring a red test into CI to prove a point nobody can act on trains people \
to ignore the gate. Delete this entry with the fix.
"""
issue = "PFactory#607"

