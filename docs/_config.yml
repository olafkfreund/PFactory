title: PFactory — Plan Factory
description: The AI planning & governance incubator in front of the execution agents. Ingest a project plan (docx/pdf/md), enrich it with live org + cloud context (Backstage, wikis, K8s/OpenShift/Azure/AWS/GCP, Terraform), run architecture/security/best-practice/feasibility gates, and emit governed GitHub epics + child issues for AIFactory to execute.

# Keep the remote theme reference so the legacy Pages auto-builder is happy,
# but override its layout via _layouts/default.html (Jekyll local layouts
# always supersede remote-theme layouts). Our custom CSS loads AFTER
# cayman's so it wins by source order.
remote_theme: pages-themes/cayman@v0.2.0

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

# Blog — posts live under /blog/<year>/<month>/<day>/<title>/
permalink: /blog/:year/:month/:day/:title/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

show_downloads: false

exclude:
  - vendor/
  - Gemfile
  - Gemfile.lock

# Repo + version metadata (used by the custom layout)
repo_url: https://github.com/olafkfreund/PFactory
release_tag: v0.6.16
release_url: https://github.com/olafkfreund/PFactory/releases/tag/v0.6.16
