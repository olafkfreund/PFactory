<section class="pipeline reveal">

      <span class="pipeline__node-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

    <div class="pipeline__arrow" aria-hidden="true"><span></span></div>

          <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>

    <div class="pipeline__arrow" aria-hidden="true"><span></span></div>

    <div class="pipeline__node" role="listitem" style="--na:#83a598">

      <span class="pipeline__node-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M12 12H6v4M12 12h6v4"/>

      <span class="pipeline__node-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

    <div class="pipeline__arrow" aria-hidden="true"><span></span></div>

    <div class="pipeline__node pipeline__node--final" role="listitem" style="--na:#fe8019">
      <span class="pipeline__step">05</span>
      <span class="pipeline__node-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 3h9l5 5v13a0 0 0 0 1 0 0H5z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>
        </svg>

      <p class="pipeline__node-name">Emit</p>
      <span class="pipeline__node-meta">GitHub → AIFactory</span>
