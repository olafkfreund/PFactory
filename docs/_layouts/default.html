<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#282828">
  <meta name="color-scheme" content="dark">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/logo/pfactory-mark.svg' | relative_url }}">
  <link rel="icon" type="image/png" sizes="256x256" href="{{ '/assets/logo/pfactory-mark.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/assets/logo/pfactory-mark.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/logo/pfactory-mark.png' | relative_url }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/pfactory.css' | relative_url }}">
</head>
<body>
  <div class="bg-mesh" aria-hidden="true">
    <div class="bg-mesh__glow bg-mesh__glow--violet"></div>
    <div class="bg-mesh__glow bg-mesh__glow--cyan"></div>
    <div class="bg-mesh__grid"></div>
  </div>

  <nav class="topnav" role="banner" aria-label="Primary">
    <div class="container topnav-inner">
      <a class="brand" href="{{ '/' | relative_url }}"><img class="brand-logo" src="{{ '/assets/logo.svg' | relative_url }}" alt="" width="26" height="26" aria-hidden="true">PFactory</a>
      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a></li>
        <li><a href="{{ '/architecture/' | relative_url }}"{% if page.url contains '/architecture/' %} class="active"{% endif %}>Architecture</a></li>
        <li><a href="{{ '/roadmap/' | relative_url }}"{% if page.url contains '/roadmap/' %} class="active"{% endif %}>Roadmap</a></li>
        <li><a href="{{ '/market-positioning/' | relative_url }}"{% if page.url contains '/market-positioning/' %} class="active"{% endif %}>Positioning</a></li>
        <li><a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' %} class="active"{% endif %}>Blog</a></li>
        <li><a href="{{ site.repo_url }}" rel="noopener">GitHub</a></li>
      </ul>
      <button class="search-btn" aria-label="Search" onclick="window.open('{{ site.repo_url }}/search', '_blank')">
        <span>search</span><kbd>⌘K</kbd>
      </button>
    </div>
  </nav>

  <main class="site-main" role="main">
    <article class="prose container">
      {{ content }}
    </article>
  </main>

  <script src="{{ '/assets/js/pfactory.js' | relative_url }}" defer></script>

  <!-- Mermaid: render ```mermaid fenced blocks (kramdown emits them as
       <pre><code class="language-mermaid">) into diagrams, dark theme to match. -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'strict' });
    document.querySelectorAll('pre > code.language-mermaid').forEach((code) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    await mermaid.run({ querySelector: '.mermaid' });
  </script>

  <footer class="site-footer" role="contentinfo">
    <div class="container site-footer__inner">
      <div>
        <strong>PFactory</strong> ·
        <a href="{{ site.repo_url }}" rel="noopener">GitHub</a> ·
        <a href="{{ site.repo_url }}/blob/main/LICENSE" rel="noopener">MIT OR GPL-3.0</a>
      </div>
      <div class="site-footer__meta">
        Built with Jekyll · Hosted on GitHub Pages
        {%- if site.release_tag -%} · <a href="{{ site.release_url }}" rel="noopener">{{ site.release_tag }}</a>{%- endif -%}
      </div>
    </div>
  </footer>
</body>
</html>
