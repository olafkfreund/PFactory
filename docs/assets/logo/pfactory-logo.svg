<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PFactory mark">
  <title>PFactory — Plan + Review</title>
  <desc>The Factory planning mark: a clipboard + check, Gruvbox green.</desc>
  <defs>
    <linearGradient id="pfG" x1="36" y1="28" x2="92" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8bb26"/>
      <stop offset="1" stop-color="#8ec07c"/>
    </linearGradient>
  </defs>
  <!-- Gruvbox dark badge -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#282828" stroke="#3c3836" stroke-width="2"/>
  <!-- clipboard body -->
  <rect x="36" y="36" width="56" height="62" rx="9" fill="none" stroke="url(#pfG)" stroke-width="6"/>
  <!-- clip -->
  <rect x="52" y="28" width="24" height="14" rx="5" fill="url(#pfG)"/>
  <!-- the "review" check -->
  <path d="M48 64l10 10 22-26" fill="none" stroke="url(#pfG)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- a plan line -->
  <path d="M50 86h28" stroke="url(#pfG)" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
</svg>
