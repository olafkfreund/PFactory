# CodeQL advanced-setup config. Runs the default query suite for every rule,
# but swaps the stock py/path-injection for our barrier-aware variant
# (py/path-injection-sanitized), which recognises this repo's sanitizers so
# verified-safe code clears instead of reporting forever.
#
# Why this is needed: stock CodeQL recognises a validator defined AND called in
# the same module -- which is why routes/pfactory_tasks.py has always read
# clean -- but does not follow one imported from services/. Every fix in #335
# routes through the shared safe_spec_component, so without this the alert
# count cannot move no matter how much of the traversal is closed.
name: "PFactory CodeQL config"
queries:
  - uses: ./.github/codeql/custom-queries
query-filters:
  - exclude:
      id: py/path-injection
  # Same swap for command injection (#505). The two critical alerts were on
  # `git` argv assembled entirely from values validated by
  # `assert_safe_git_ref`, which lives in services/git_utils.py — imported, so
  # stock CodeQL does not follow it. py/command-line-injection-sanitized is the
  # identical query with that validator (and its wrappers) as a barrier.
  - exclude:
      id: py/command-line-injection
  # And for SSRF (#517). `assert_safe_probe_url` resolves the host and checks
  # every returned address, but it establishes safety by RAISING, which stock
  # CodeQL does not model — returning the checked value does not help either,
  # since the function returns its argument and the taint flows through. That
  # was measured, not assumed: the alert survived that change.
  - exclude:
      id: py/full-ssrf
