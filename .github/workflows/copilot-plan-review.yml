name: Review Copilot Plan-Draft PRs

# Component 4 of the GitHub Agentic Integration (epic #87 / #90).
# When the Copilot cloud agent opens a plan-draft PR (Component 2 dispatch),
# run PFactory's governance/review gates on it and post the results. If no
# PFACTORY_URL secret is configured, fall back to an inline Copilot CLI review.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  pfactory-plan-review:
    # Identity/membership gate (issue #127): the Copilot cloud agent commits as
    # the actor that triggered its dispatch, so a [bot]-suffix actor check is a
    # string-suffix authorization bypass (CVE-2025-66032 anti-pattern). Trust the
    # PR only when it originates from a trusted association — the repo owner, an
    # org member, or an invited collaborator. Forks / drive-by external PRs do
    # not satisfy this and are skipped.
    #
    # Scope gate (#246): this job only reviews *Copilot plan-draft* PRs, so it
    # must not run on ordinary human/refactor PRs (where the no-secret fallback
    # fails). PFactory assigns the planning issue to the Copilot cloud agent
    # (copilot-swe-agent[bot]); GitHub opens the resulting PR from a `copilot/`
    # head branch authored by that agent. We narrow on those platform-stable
    # markers. This is a *scope* condition layered on top of — never replacing —
    # the trust gate above (so it is not the [bot]-suffix authorization anti-
    # pattern of #127); it can only reduce when the job runs, never widen trust.
    if: >-
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
               github.event.pull_request.author_association)
      && (
           startsWith(github.event.pull_request.head.ref, 'copilot/')
           || github.event.pull_request.user.login == 'Copilot'
           || github.event.pull_request.user.login == 'copilot-swe-agent[bot]'
         )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run PFactory plan review gates
        # This job is advisory. It is now scoped to Copilot plan-draft PRs (the
        # job-level `if`, #246), so it no longer runs on unrelated PRs. We keep
        # continue-on-error as defense-in-depth: even on a genuine Copilot PR, if
        # PFACTORY_URL is unset the fallback Copilot CLI isn't authenticated in
        # CI and exits non-zero — that should degrade gracefully, not red-X the PR.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PFACTORY_URL: ${{ secrets.PFACTORY_URL }}
          PFACTORY_TOKEN: ${{ secrets.PFACTORY_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # Bind every event field used below into env so no untrusted
          # ${{ github.event.* }} value is interpolated directly into the shell
          # (script-injection hardening, issue #127).
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ -n "${PFACTORY_URL:-}" ]; then
            # Notify PFactory to run its plan review / governance gates on the
            # Copilot-authored plan-draft PR.
            jq -n \
              --arg repo "$REPO" \
              --argjson pr "$PR_NUMBER" \
              '{repo: $repo, pr_number: $pr}' \
            | curl -sf -X POST "$PFACTORY_URL/api/github/prs/$PR_NUMBER/plan-review" \
                -H "Authorization: Bearer $PFACTORY_TOKEN" \
                -H "Content-Type: application/json" \
                --data-binary @-
          else
            # Fallback: inline Copilot CLI review of the draft plan.
            # Scoped to the minimum required tools — NOT --allow-all-tools.
            # An all-tools agent reasoning/executing over attacker-controllable
            # PR diffs is indirect prompt injection on the execution layer; the
            # runner holds factory tokens (issue #127). We only need the GitHub
            # MCP surface to post a review comment, with no shell/file execution.
            npm install -g @github/copilot 2>/dev/null || true
            copilot -p "Review this plan-draft PR for feasibility, completeness, and governance: are the requirements, decomposition, and acceptance criteria sound? Post a concise summary review comment." \
              --allow-tool github --no-color \
              --add-dir "$WORKSPACE" || \
              gh pr comment "$PR_NUMBER" \
                --body "PFactory: set the \`PFACTORY_URL\` secret (or install the Copilot CLI) to run plan-review gates automatically."
          fi
