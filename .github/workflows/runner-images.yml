# runner-images.yml — Task 7 (#23), sub-task 7.4
#
# Build all PFactory framework runner images on push to main and on PRs
# that touch any Dockerfile or this workflow file.
#
# On PRs the workflow builds + smoke-tests each image and stops there. On push to
# main, after the smoke passes, each image is published to GHCR and signed.
#
# Image tags produced:
#   pfactory-runner-{pytest,jest,playwright,vitest,cypress,cloud}:<commit-sha>
#   pfactory-runner-{...}:latest                     (loaded locally for the smoke)
# Published + signed on main only:
#   ghcr.io/<owner>/pfactory-runner-{...}:<commit-sha>
#   ghcr.io/<owner>/pfactory-runner-{...}:latest
#
# Until #449 this workflow built six images and published none. The header said
# so -- "Registry push is deferred to a separate task once a registry ... is
# provisioned" -- and the registry had been provisioned for the application image
# for some time. The consequence was not that the lanes had no images: it was
# that nothing tied the tag a lane runs to a commit. The consumers resolve
# `pfactory-runner-*:latest` by bare tag, and guides/shipping.md tells the
# operator to `docker build -t pfactory-runner-pytest:latest` by hand, so the
# lanes executed whatever was last built on that machine while CI built an image,
# smoke-tested it, and threw it away. That is the shape of TFactory#886 -- a
# merged fix that never reaches the image the lane runs -- with the publish step
# missing rather than the workflow.
#
# The push and the signature land together on purpose. An unsigned image in the
# registry is the state Factory#524 exists to clean up, and this workflow was
# named in that issue as unsignable precisely because it published nothing.
# Steps below are the ones TFactory's runner-images.yml already runs; copied, not
# re-derived, so the two cannot drift.

name: Build runner images

on:
  push:
    branches: [main]
    paths:
      - 'docker/pfactory-runner-*/**'
      - '.github/workflows/runner-images.yml'
  pull_request:
    paths:
      - 'docker/pfactory-runner-*/**'
      - '.github/workflows/runner-images.yml'

# Cancel superseded runs on the same ref (matches ci.yml convention)
concurrency:
  group: runner-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # publish runner images to GHCR (push to main only)
  id-token: write   # cosign keyless via GitHub OIDC (Factory#524)

jobs:
  build:
    name: build ${{ matrix.runner }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false   # keep building remaining images if one fails
      matrix:
        runner: [pytest, jest, playwright, vitest, cypress, cloud]

    steps:
      # Rebuild the security layer at most daily; without a changing arg the
      # `apt-get upgrade` layer is served from the build cache forever.
      - name: Compute security-refresh token
        run: echo "SECURITY_REFRESH=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker/setup-buildx-action enables BuildKit features (layer caching,
      # multi-platform builds, --check flag). Required for dockerfile:1.7 syntax.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # Build the image and load it into the local Docker daemon so the
      # hello-world smoke step below can run it.
      # push: false — nothing reaches the registry until the smoke has passed.
      # load: true  — exports image to local daemon for the smoke test.
      - name: Build pfactory-runner-${{ matrix.runner }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: docker/pfactory-runner-${{ matrix.runner }}
          file: docker/pfactory-runner-${{ matrix.runner }}/Dockerfile
          push: false
          load: true
          tags: |
            pfactory-runner-${{ matrix.runner }}:${{ github.sha }}
            pfactory-runner-${{ matrix.runner }}:latest
          # GHA cache: reuse layer cache across runs scoped per framework image.
          # mode=max: cache all layers, not just the final stage.
          build-args: |
            SECURITY_REFRESH=${{ env.SECURITY_REFRESH }}
          cache-from: type=gha,scope=runner-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=runner-${{ matrix.runner }}

      # Hello-world smoke: verify the image runs a trivial command.
      # Each case mirrors what test_docker_runner.py tests in CI.
      - name: Hello-world smoke — ${{ matrix.runner }}
        run: |
          case "${{ matrix.runner }}" in
            pytest)
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                pfactory-runner-pytest:latest \
                python -c 'print("pfactory-runner-pytest ok")'
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                pfactory-runner-pytest:latest \
                pytest --version
              ;;
            jest)
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                pfactory-runner-jest:latest \
                node -e 'console.log("pfactory-runner-jest ok")'
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                pfactory-runner-jest:latest \
                jest --version
              ;;
            playwright)
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=256m \
                pfactory-runner-playwright:latest \
                node -e 'console.log("pfactory-runner-playwright ok")'
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=256m \
                pfactory-runner-playwright:latest \
                npx playwright --version
              ;;
            vitest)
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                pfactory-runner-vitest:latest \
                node -e 'console.log("pfactory-runner-vitest ok")'
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                pfactory-runner-vitest:latest \
                vitest --version
              ;;
            cypress)
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=256m \
                pfactory-runner-cypress:latest \
                node -e 'console.log("pfactory-runner-cypress ok")'
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=256m \
                pfactory-runner-cypress:latest \
                cypress --version
              ;;
            cloud)
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                pfactory-runner-cloud:latest \
                prowler --version
              docker run --rm \
                --network=none \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                pfactory-runner-cloud:latest \
                checkov --version
              ;;
          esac

      # ---------------------------------------------------------------------
      # Publish to GHCR — only on push to main, and only after the smoke above
      # passed, so a broken image never reaches the registry. PRs (including
      # forks) skip these steps and stay build-and-smoke only.
      # ---------------------------------------------------------------------
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-run the build to push: every layer is already in the GHA cache from
      # the build step above, so this is effectively just a registry upload.
      - name: Push pfactory-runner-${{ matrix.runner }} to GHCR
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: docker/pfactory-runner-${{ matrix.runner }}
          file: docker/pfactory-runner-${{ matrix.runner }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pfactory-runner-${{ matrix.runner }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/pfactory-runner-${{ matrix.runner }}:latest
          build-args: |
            SECURITY_REFRESH=${{ env.SECURITY_REFRESH }}
          cache-from: type=gha,scope=runner-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=runner-${{ matrix.runner }}

      # ---------------------------------------------------------------------
      # Sign what this workflow publishes (Factory#524).
      #
      # These six images are where LLM-generated test code is executed. Landing
      # the push without the signature would create exactly the unsigned-image
      # state that issue exists to clean up.
      #
      # Sign by DIGEST: cosign signatures are digest-keyed, so one signature
      # covers both :<sha> and :latest for this runner.
      # ---------------------------------------------------------------------
      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1

      - name: Sign pfactory-runner-${{ matrix.runner }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: "ghcr.io/${{ github.repository_owner }}/pfactory-runner-${{ matrix.runner }}"
          DIGEST: "${{ steps.push.outputs.digest }}"
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Assert the EXACT identity an admission rule will pin, anchored at both
      # ends — not a repo prefix. A self-test looser than the gate it models
      # passes on signatures the gate rejects (Factory#522).
      - name: Verify signature (self-test) — ${{ matrix.runner }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: "ghcr.io/${{ github.repository_owner }}/pfactory-runner-${{ matrix.runner }}"
          DIGEST: "${{ steps.push.outputs.digest }}"
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/\.github/workflows/runner-images\.yml@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      # Asks the question the CLUSTER asks, not cosign's. Factory#804.
      - name: Assert the signature is where Kyverno looks — ${{ matrix.runner }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: "ghcr.io/${{ github.repository_owner }}/pfactory-runner-${{ matrix.runner }}"
          DIGEST: "${{ steps.push.outputs.digest }}"
        run: ./.github/scripts/assert-signature-location.sh "${IMAGE}" "${DIGEST}"
