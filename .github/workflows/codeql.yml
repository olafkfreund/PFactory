name: CodeQL

on:
  push:
    # dev is included deliberately even though it is currently dormant (0
    # commits ahead of main). A security gate that only covers the branch
    # people happen to use today silently stops covering them the moment the
    # workflow changes - and AIFactory, the one sibling where dev genuinely
    # diverges, already scans both.
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "23 4 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Swaps stock py/path-injection for the barrier-aware variant so the
          # shared sanitizers in services/git_utils are recognised (#338).
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
