name: factory_common drift

# Byte-exact drift gate for the vendored factory_common package
# (epic Factory#154; hub canonical: shared/factory-common/factory_common/).
#
# This repo vendors the hub's shared layer at apps/web-server/factory_common/.
# That copy MUST stay byte-identical to the canonical at the SHA pinned in
# apps/web-server/factory_common/.hub-sha. This job checks out the hub at that
# SHA and diffs the tracked files; a byte mismatch fails the build.
#
# The gate ships in the SAME pull request as the vendored copy it guards, so
# there is never a window in which the copy exists ungated. An unchecked
# vendored copy is worse than no vendored copy, because it carries the
# appearance of a contract (the reasoning in verification-core-drift.yml, and
# Factory#397 / Factory#400 - this repo already lost weeks to two hub modules
# that were vendored with no gate of any kind and had silently diverged).
#
# To change a vendored module: land it in the hub canonical first, re-vendor it
# here byte-for-byte, then bump .hub-sha. Never edit a vendored copy to satisfy
# a local style bar -- these copies are governed by this byte-exact gate, not by
# the repo style config (they are excluded in ruff.toml for exactly that
# reason).
#
# PIN HAZARD (Factory#638, and the same note verification-core-drift.yml
# carries): .hub-sha must hold a SQUASH-MERGE commit on hub `main`, never a hub
# PR-branch head. The hub squash-merges, so a branch head stops existing the
# moment its PR lands and the pin then resolves to nothing -- a gate that cannot
# run rather than one that fails honestly.

on:
  pull_request:
    branches: [dev, main]
    # No paths: filter, matching verification-core-drift.yml in this repo
    # (Factory#525). A filter switches the gate off for exactly the PR that
    # never touches the listed paths, and on a green PR page "the check did not
    # run" is indistinguishable from "the check passed" (Factory#471). This gate
    # is a four-file diff against a checkout; running it always costs seconds.
  push:
    branches: [dev, main]

concurrency:
  group: factory-common-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: vendored factory_common matches the hub canonical
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4 rather than a 40-hex pin to match every other
      # workflow in this repo. PFactory has no SHA-pinned actions today; the
      # fleet-wide pinning sweep (Factory#731) should convert this file with
      # the rest of them in one pass, not leave it as the lone dialect.
      - uses: actions/checkout@v4
        with:
          path: pfactory

      - name: Read pinned hub SHA
        id: pin
        # Validated before use, because this file comes from the PR's own tree:
        # on a fork PR its contents are attacker-controlled, and the value is
        # handed straight to actions/checkout as a `ref`. Reject anything that is
        # not a bare 40-character commit id. (CodeQL actions/untrusted-checkout;
        # the sibling gates in AIFactory grew this guard in Factory#711.)
        run: |
          set -euo pipefail
          sha="$(tr -d '[:space:]' < pfactory/apps/web-server/factory_common/.hub-sha)"
          if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "factory_common/.hub-sha is not a 40-character commit SHA: '${sha}'" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # No continue-on-error: an unreachable hub is a gate that cannot run, and
      # per standards rule 4.7 that must fail rather than pass. If Factory ever
      # becomes private, add a read token here -- do not add a soft-skip.
      - name: Check out hub factory-common at the pinned SHA
        uses: actions/checkout@v4
        with:
          repository: olafkfreund/Factory
          ref: ${{ steps.pin.outputs.sha }}
          path: factory-hub
          # This tree is only ever diffed, never executed, and nothing here runs
          # git against it afterwards. Do not leave the job token behind in
          # factory-hub/.git/config, where a checked-out ref chosen by the PR
          # would sit next to it.
          persist-credentials: false

      - name: Diff vendored factory_common against the hub canonical
        run: |
          set -euo pipefail
          canonical="factory-hub/shared/factory-common/factory_common"
          vendored="pfactory/apps/web-server/factory_common"
          expected="__init__.py http.py logsafe.py secrets.py url_safety.py"

          # The file list is hand-maintained, and a hand-maintained list is
          # precisely how logsafe.py ended up vendored-but-ungated in AIFactory:
          # the module was copied in, the list was not updated, and the gate
          # stayed green over an unguarded copy. So the list is itself checked
          # against BOTH trees first. A new canonical module, or a new vendored
          # one, fails here loudly instead of being skipped in silence.
          want="$(printf '%s\n' ${expected} | sort | tr '\n' ' ')"
          for tree in "${vendored}" "${canonical}"; do
            found="$(cd "${tree}" && ls -1 ./*.py | sed 's|^\./||' | sort | tr '\n' ' ')"
            if [ "${found}" != "${want}" ]; then
              echo "FILE LIST STALE for ${tree}"
              echo "  gate checks: ${want}"
              echo "  tree holds : ${found}"
              echo "Add the module to \`expected\` in this workflow (and vendor it), or remove it from both."
              exit 1
            fi
          done

          for f in ${expected}; do
            if ! diff "${vendored}/${f}" "${canonical}/${f}"; then
              echo "DRIFT: ${vendored}/${f} diverged from the hub canonical (${canonical}/${f})."
              echo "Re-vendor from the hub and bump apps/web-server/factory_common/.hub-sha,"
              echo "or land the change in shared/factory-common/ in the hub first."
              exit 1
            fi
          done
          echo "No drift: vendored factory_common matches the pinned hub canonical."
