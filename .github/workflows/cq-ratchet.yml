name: code-quality (ratchet)

# Factory Coding Standards adoption — Phase 0 (epic Factory#154, issues #192 #196).
#
# Enforcement model (standards/coding-standards.md sections 0 and 4.6), mirroring
# the reference CFactory pattern:
#   - The shared strict select set is governed by the repo's root ruff.toml,
#     which adopts the vendored hub baseline (standards/ruff.toml).
#   - ruff AND mypy --strict are enforced under one no-regression RATCHET
#     (scripts/ratchet_lint.py, originally vendored from CFactory): per changed
#     apps/backend Python file it counts ruff violations AND mypy --strict errors
#     at the PR base vs HEAD and fails only if HEAD has MORE. Legacy hotspots stay
#     green until touched; net-new violations block. This job is BLOCKING. The
#     blocking-mypy half is issue #192 (mypy was previously informational).
#   - `ruff format --check apps/backend apps/web-server scripts` is BLOCKING
#     (formatting is auto-applied, never reviewed — section 3.6) and pinned to
#     the same ruff version that the tree was formatted with, so it is green.
#   - A config-drift gate keeps the vendored baseline pinned to the hub, and
#     (#470) keeps the repo-ROOT ruff.toml / mypy.ini / .editorconfig from
#     loosening that baseline — the tighten-only rule of section 0 / 1.2, which
#     until now was asserted in a comment and enforced by nothing.
#
# A whole-repo blocking `ruff check` / `mypy --strict` strict gate is
# intentionally NOT used here (and the existing ci.yml ruff step was converted to
# the same ratchet): the ~6.5k legacy violation count (plus a large untyped
# backlog) would make it instantly red. Legacy is fixed on touch under the
# ratchet.
#
# SCOPE: apps/backend, apps/web-server and scripts/.
#
# scripts/ was added in Factory#597 for one reason: scripts/ratchet_lint.py IS
# this gate, and it sat outside every ruff and mypy scope this repo has — the
# file that counts findings on each changed backend file was the one file no run
# looked at. `ruff check` findings in it, measured on dev at the time: 0 (this
# repo's fork was already clean under both the root config and the bare shared
# baseline; #455's rewire removed the last one). `ruff format` drift: 9 files
# under scripts/, the ratchet among them, swept in the same PR because the
# format gate is WHOLE-TREE and cannot grandfather anything.
#
# apps/web-server was the last piece of the LINT scope still outside the FORMAT
# scope (#479). The ratchet covered all three trees; `ruff format --check`
# covered two, so this tree was held to the rule bar and to no formatting bar at
# all — 122 of its 190 files were unformatted, 64% of the tree. That is the same
# divergence #363 (Factory#384) fixed for `ruff check`, one gate later. The sweep
# is the commit before this one, because a WHOLE-TREE format gate cannot
# grandfather anything.
#
# scripts/ratchet_helpers.py stays out, and needed no new config to do so: it is
# already in ruff.toml's extend-exclude as the byte-exact hub canonical, and this
# ratchet honours those excludes itself (_ruff_excludes). Reformatting a vendored
# copy to satisfy a LOCAL rule is what breaks the next re-vendor (Factory#403).
#
# .husky/pre-commit is deliberately NOT widened to match. It rewrites staged
# files with whatever ruff is on PATH, unpinned (#452), so extending its glob to
# scripts/ would import exactly the drift this change exists to remove. The hook
# keeps its apps/backend glob; scripts/ is gated by CI, where the pin holds.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: cq-ratchet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Single source of truth for the ruff pin. MUST match ci.yml's RUFF_VERSION and
  # the version the tree was formatted with, or format-check will be red.
  RUFF_VERSION: "0.15.17"
  MYPY_VERSION: "1.20.1"
  PACKAGE_DIR: "apps/backend"

jobs:
  ratchet-ruff:
    name: ratchet ruff + mypy (changed files, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need history back to the PR base for the diff-scoped ratchet.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"

      - name: Create venv + install lint toolchain (pinned) + backend deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt
          uv pip install "ruff==${RUFF_VERSION}" "mypy==${MYPY_VERSION}"
          # Stubs for the mypy half of the ratchet: without them mypy reports
          # import-untyped and then treats those libraries as Any, so the strict
          # bar stops applying at the boundary (PFactory#468).
          uv pip install -r requirements-typestubs.txt

      - name: Determine base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Ratchet (ruff + mypy on changed files; blocks net-new violations)
        run: |
          # Put the venv's pinned ruff+mypy first on PATH so the ratchet shells
          # out to them (the ratchet invokes `ruff`, `mypy` and `git` as plain
          # commands). The mypy half (issue #192) uses the same no-regression
          # model as ruff: a changed file may not GAIN mypy --strict errors vs the
          # PR base; legacy untyped files stay green until touched.
          export PATH="${GITHUB_WORKSPACE}/apps/backend/.venv/bin:${PATH}"
          apps/backend/.venv/bin/python scripts/ratchet_lint.py --base "${{ steps.base.outputs.ref }}" --package "${PACKAGE_DIR}" --package apps/web-server --package scripts

  format-check:
    name: ruff format --check (apps/backend + apps/web-server + scripts, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"

      - name: Install ruff (pinned)
        run: uv tool install "ruff==${RUFF_VERSION}"

      - name: Ruff format check (apps/backend + apps/web-server + scripts)
        run: ruff format --check apps/backend apps/web-server scripts

  config-drift:
    name: config drift (vendored baseline pinned to hub)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The vendored standards/ copy must match the Factory hub at the pinned SHA
    # (standards/README.md).
    #
    # It used to soft-skip on a fetch error so a GitHub outage could not red the
    # build. That made a blocking gate report success from a comparison it never
    # made, and the failure modes are not all outages: a garbage-collected pin,
    # a renamed hub file, or Factory going private all fetch-fail forever and
    # would have skipped forever, silently. Rule 4.7 names this case in as many
    # words ("a fetch that times out ... has not verified anything"). A real
    # outage now costs a re-run, which is cheap and visible; the old behaviour
    # cost nothing and told you nothing (Factory#471).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the hub pin is really on hub main
        # standards/.hub-sha comes from the PR's own tree and is handed to
        # raw.githubusercontent as a ref against olafkfreund/Factory. GitHub
        # serves every fork of a repo from one object store, so a commit that
        # exists only in a fork of Factory is still fetchable by SHA from
        # Factory itself -- a fork PR could otherwise pin a standards/ tree
        # matching its own drifted copy and this gate would diff two matching
        # trees and go green (Factory#806).
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .github/scripts/assert-hub-pin-on-main.sh \
            "$(tr -d '[:space:]' < standards/.hub-sha)" "standards/.hub-sha"

      - name: Diff vendored baseline against pinned hub
        run: |
          set -euo pipefail
          # Factory#512 / rule 5.2: `standards/.hub-sha` is the ONE pin filename
          # fleet-wide. This used to be a SHA hardcoded in this workflow's env --
          # which the standard rules out, and which was already inconsistent with
          # the error message below telling you to "bump standards/.hub-sha".
          # Tooling that wants the pin now finds it where every sibling keeps it.
          HUB_SHA="$(tr -d '[:space:]' < standards/.hub-sha)"
          if [ -z "$HUB_SHA" ]; then
            echo "::error::standards/.hub-sha is empty or missing — the drift check"
            echo "cannot know what to compare against, so it fails rather than"
            echo "passing (rule 4.7)."
            exit 1
          fi
          base="https://raw.githubusercontent.com/olafkfreund/Factory/${HUB_SHA}/standards"
          fail=0
          for f in ruff.toml mypy.ini .editorconfig coding-standards.md; do
            if ! curl -fsSL "${base}/${f}" -o "/tmp/hub-${f}"; then
              echo "::error::could not fetch ${f} from the hub at ${HUB_SHA}."
              echo "The drift check cannot run, so it fails rather than passing"
              echo "(rule 4.7). If this is a transient GitHub error, re-run the job;"
              echo "if the pin was garbage-collected, bump standards/.hub-sha."
              fail=1
              continue
            fi
            if ! diff -u "/tmp/hub-${f}" "standards/${f}"; then
              echo "::error::standards/${f} drifted from the pinned hub baseline"
              fail=1
            fi
          done
          exit $fail

      # ---------------------------------------------------------------------
      # Factory#730: the step above (and the two "must extend"/"must not
      # loosen" checks below) compare FILE BYTES. standards/ruff.toml can be
      # byte-identical to the hub while the EFFECTIVE config a plain
      # `ruff check` resolves is not -- a per-file-ignores table that a local
      # override table replaces rather than merges, or a target-version that
      # never makes it into the root config, reopen exactly what the vendored
      # file closes, and no byte diff sees either. This asserts on the
      # resolved behaviour instead of the file.
      #
      # The probe lives under tests/ so it must earn the shared S101/PLR2004
      # test carve-out (standards/ruff.toml's per-file-ignores), and it sorts
      # stdlib `tomllib` ahead of a third-party import -- clean only under
      # target-version >= py311 (tomllib is stdlib since 3.11; an older or
      # unset target classifies it third-party and demands the opposite
      # order). The hub baseline is clean on this probe by construction, so
      # this repo's ORDINARY `ruff check` (no --config override, exactly what
      # a developer or another CI job gets) must be too.
      - name: Install ruff (pinned)
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Effective config matches the hub baseline (not just file bytes)
        run: |
          set -euo pipefail
          probe_dir="tests/__ruff_drift_probe__"
          probe="${probe_dir}/test_probe.py"
          mkdir -p "${probe_dir}"
          cat > "${probe}" <<'PY'
          import tomllib

          import requests

          assert requests and tomllib
          PY
          trap 'rm -rf "${probe_dir}"' EXIT

          repo_verdict="$(ruff check --select S,I,UP --output-format concise "${probe}" 2>&1 || true)"
          hub_verdict="$(ruff check --select S,I,UP --output-format concise --config /tmp/hub-ruff.toml "${probe}" 2>&1 || true)"

          if [ "${repo_verdict}" != "${hub_verdict}" ]; then
            echo "::error::Effective ruff config has drifted from the hub baseline (Factory#730)."
            echo "--- this repo, ordinary \`ruff check\` (no --config override) ---"
            echo "${repo_verdict}"
            echo "--- hub baseline (standards/ruff.toml) ---"
            echo "${hub_verdict}"
            echo "File bytes can match while the EFFECTIVE config (per-file-ignores reach, target-version)"
            echo "does not. Fix the root ruff.toml (extend / target-version / per-file-ignores); this is"
            echo "not a standards/ruff.toml byte diff."
            exit 1
          fi
          echo "Effective config matches the hub baseline for the S101/target-version probe."

      # ---------------------------------------------------------------------
      # Tighten-only (#470). The step above pins the VENDORED baseline to the
      # hub; these three pin the REPO-ROOT configs to that baseline. Both halves
      # are needed and they check different things: standards/ is what CI reads
      # (ratchet_lint.MYPY_CONFIG_DEFAULT), the root files are what a bare
      # `mypy` / `ruff` and every editor read locally -- which is where a type
      # error is meant to be caught first.
      #
      # Until now nothing checked the root copies. A PR could set
      # `strict = False` in mypy.ini, or drop `disallow_untyped_defs`, and every
      # gate stayed green: the CI verdict would not move (the ratchet reads
      # standards/mypy.ini directly) while every developer's local bar silently
      # dropped. Section 0 / 1.2 says per-service configs may only TIGHTEN and
      # that "a config-lint CI check enforces tighten-only"; the hub has run
      # exactly these steps in its own config-drift job for months. Ported
      # rather than reinvented.
      # ---------------------------------------------------------------------
      - name: root ruff.toml must extend the canonical baseline
        run: grep -q 'extend = "standards/ruff.toml"' ruff.toml

      - name: root mypy.ini must not loosen the strict baseline
        run: |
          set -euo pipefail
          # Every `<key> = True` spelled out in the canonical baseline must also
          # be True in the root copy. Tighten-only: extra flags are fine, missing
          # or flipped ones are not.
          #
          # `|| true`: grep exits 1 on no match, and under `pipefail` that would
          # abort here with no diagnostic. Let it produce an empty list and be
          # rejected explicitly below, so the log says WHY.
          keys="$(grep -E '^[a-z_]+ = True' standards/mypy.ini | cut -d' ' -f1 || true)"
          # An empty key list would make the loop below a no-op and the step a
          # green check of nothing -- the exact failure rule 4.7 names, and the
          # one this job's fetch step was already fixed for. A renamed or emptied
          # standards/mypy.ini fails here instead of passing.
          if [ -z "$keys" ]; then
            echo "::error::no strict flags found in standards/mypy.ini — this"
            echo "check would compare nothing, so it fails rather than passing"
            echo "(rule 4.7)."
            exit 1
          fi
          for key in $keys; do
            grep -qE "^${key} = True" mypy.ini || {
              echo "::error::mypy.ini is missing strict flag: ${key}"
              echo "Root configs may only TIGHTEN the shared baseline (section 0 / 1.2)."
              exit 1; }
          done
          grep -qE '^strict = True' mypy.ini || {
            echo "::error::mypy.ini does not set strict = True"; exit 1; }

      - name: root .editorconfig matches the fleet baseline
        run: diff -u standards/.editorconfig .editorconfig
