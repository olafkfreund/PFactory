name: Release

# Auto-tag + GitHub release when package.json version changes on main.
#
# Workflow:
#   1. Bump version on a feature/release branch: `node scripts/bump-version.js <version>`
#   2. Add a matching `## <version>` section to CHANGELOG.md
#   3. PR to main, merge
#   4. This workflow:
#      - Detects the version change vs the previous main commit
#      - Validates CHANGELOG.md has a `## <version>` entry
#      - Creates an annotated git tag `v<version>`
#      - Creates a GitHub release with notes extracted from CHANGELOG.md
#
# If the merge doesn't bump the version, the job exits early (no-op).

on:
  push:
    branches: [main]
  # Manual re-release of an existing version — e.g. when a prior run cut the
  # tag/release but the image build failed for a transient/infra reason. Builds
  # the given version regardless of the package.json-bump auto-detection.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)release, e.g. 0.6.4. Defaults to package.json."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write        # push image to GHCR
  id-token: write        # cosign keyless via GitHub OIDC
  attestations: write    # cosign attest (SBOM)

jobs:
  release:
    name: Tag + GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with parent commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect version bump
        id: detect
        run: |
          # Manual dispatch: (re)release the requested version unconditionally.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NEW="${{ github.event.inputs.version }}"
            [ -z "$NEW" ] && NEW=$(jq -r '.version' package.json)
            echo "new=$NEW" >> "$GITHUB_OUTPUT"
            echo "old=manual" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — (re)releasing $NEW"
            exit 0
          fi

          NEW=$(jq -r '.version' package.json)
          OLD=$(git show HEAD~1:package.json 2>/dev/null | jq -r '.version' 2>/dev/null || echo "")

          if [ -z "$NEW" ] || [ "$NEW" = "null" ]; then
            echo "::error::package.json has no version field"
            exit 1
          fi

          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"

          if [ "$NEW" = "$OLD" ]; then
            echo "Version unchanged ($NEW) — skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version bumped: ${OLD:-<none>} -> $NEW"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate CHANGELOG entry
        if: steps.detect.outputs.should_release == 'true'
        run: |
          V="${{ steps.detect.outputs.new }}"
          ESCAPED="${V//./\\.}"
          if ! grep -qE "^## ${ESCAPED}([[:space:]]|-|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing an entry for version $V."
            echo "::error::Add a heading matching: '## $V' or '## $V - <date>'"
            exit 1
          fi
          echo "CHANGELOG entry for $V found."

      - name: Check tag doesn't already exist
        if: steps.detect.outputs.should_release == 'true'
        run: |
          V="${{ steps.detect.outputs.new }}"
          if git ls-remote --exit-code --tags origin "v$V" >/dev/null 2>&1; then
            echo "::error::Tag v$V already exists on origin."
            echo "::error::Bump the version again or delete the tag with: git push origin :refs/tags/v$V"
            exit 1
          fi
          echo "Tag v$V is available."

      - name: Extract changelog section
        if: steps.detect.outputs.should_release == 'true'
        run: |
          V="${{ steps.detect.outputs.new }}"
          awk -v v="$V" '
            $0 ~ "^## " v "([[:space:]]|-|$)" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          # Trim leading/trailing blank lines
          sed -i -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}' release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::Extracted release notes are empty. Check the section between '## $V' and the next '## ' heading."
            exit 1
          fi

          echo "---- release-notes.md ----"
          cat release-notes.md
          echo "--------------------------"

      # ----------------------------------------------------------------------
      # P0 supply-chain pipeline: multi-arch build → push → cosign sign +
      # SBOM attest → self-verify. Runs FIRST so a failed/unsigned push leaves
      # NO dangling tag or release behind (#104): the tag + GitHub release are
      # created only after the image is pushed, signed, attested, and verified.
      # ----------------------------------------------------------------------

      - name: Set up QEMU
        if: steps.detect.outputs.should_release == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        if: steps.detect.outputs.should_release == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        if: steps.detect.outputs.should_release == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The pfactory GHCR package is not linked to this repo, so the default
          # GITHUB_TOKEN can't push it (403 Forbidden). Prefer GHCR_PAT (a PAT
          # with write:packages); fall back to GITHUB_TOKEN. Mirrors TFactory.
          password: "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}"

      - name: Build + push bank-pilot image (WITH_RMUX=false, multi-arch)
        if: steps.detect.outputs.should_release == 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          # amd64-only: the cluster + all current consumers are amd64, and the
          # arm64 leg fails on the upstream npm rollup optional-dep bug
          # (npm/cli#4828) under QEMU. Matches the dev/demo image below. Restore
          # linux/arm64 once the frontend build resolves arm64 rollup natively.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pfactory:v${{ steps.detect.outputs.new }}
            ghcr.io/${{ github.repository_owner }}/pfactory:latest
          # Default WITH_RMUX=false in the Dockerfile — bank-pilot image
          # contains no rmux binary and no rmux deps.  Trivy + SBOM
          # verify this in the post-build steps below.
          provenance: mode=max
          sbom: true

      # Epic #44 R3 — second image variant bundling rmux v0.3.1.
      # Tagged ``:vX-rmux``; intended for dev/demo deployments where
      # operators opt in via Helm ``rmux.enabled=true``.  Arch-pinned
      # to amd64 because rmux upstream has no aarch64 Linux build yet
      # (tracked at https://github.com/Helvesec/rmux/issues).
      - name: Build + push dev/demo image (WITH_RMUX=true, amd64-only)
        if: steps.detect.outputs.should_release == 'true'
        id: build_rmux
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            WITH_RMUX=true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pfactory:v${{ steps.detect.outputs.new }}-rmux
            ghcr.io/${{ github.repository_owner }}/pfactory:latest-rmux
          provenance: mode=max
          sbom: true

      - name: Install cosign
        if: steps.detect.outputs.should_release == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign both images (cosign keyless via Sigstore + GitHub OIDC)
        if: steps.detect.outputs.should_release == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/pfactory@${{ steps.build.outputs.digest }}"
          IMAGE_RMUX="ghcr.io/${{ github.repository_owner }}/pfactory@${{ steps.build_rmux.outputs.digest }}"
          cosign sign --yes "$IMAGE"
          cosign sign --yes "$IMAGE_RMUX"

      - name: Install Syft
        if: steps.detect.outputs.should_release == 'true'
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0

      - name: Generate SBOMs + attest both images with cosign
        if: steps.detect.outputs.should_release == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/pfactory@${{ steps.build.outputs.digest }}"
          IMAGE_RMUX="ghcr.io/${{ github.repository_owner }}/pfactory@${{ steps.build_rmux.outputs.digest }}"
          # Bank-pilot image
          syft scan "$IMAGE" -o spdx-json=sbom.spdx.json
          syft scan "$IMAGE" -o cyclonedx-json=sbom.cyclonedx.json
          cosign attest --yes --type spdxjson    --predicate sbom.spdx.json      "$IMAGE"
          cosign attest --yes --type cyclonedx   --predicate sbom.cyclonedx.json "$IMAGE"
          # Dev/demo image (rmux variant)
          syft scan "$IMAGE_RMUX" -o spdx-json=sbom-rmux.spdx.json
          syft scan "$IMAGE_RMUX" -o cyclonedx-json=sbom-rmux.cyclonedx.json
          cosign attest --yes --type spdxjson    --predicate sbom-rmux.spdx.json      "$IMAGE_RMUX"
          cosign attest --yes --type cyclonedx   --predicate sbom-rmux.cyclonedx.json "$IMAGE_RMUX"

      - name: Verify signature (release self-test)
        if: steps.detect.outputs.should_release == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/pfactory@${{ steps.build.outputs.digest }}"
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository_owner }}/PFactory/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE"

      # Image is pushed, signed, attested and verified above — only now is it
      # safe to cut the tag + release. A failure in any prior step leaves no
      # `vX.Y.Z` tag or release, so workflow_dispatch re-runs are idempotent (#104).
      - name: Create + push tag
        if: steps.detect.outputs.should_release == 'true'
        run: |
          V="${{ steps.detect.outputs.new }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "Release v$V"
          git push origin "v$V"

      - name: Create GitHub release
        if: steps.detect.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.detect.outputs.new }}"
          gh release create "v$V" \
            --title "v$V" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Upload SBOM artifacts to GitHub release
        if: steps.detect.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.detect.outputs.new }}"
          gh release upload "v$V" sbom.spdx.json sbom.cyclonedx.json --clobber
