# Base-image updates for the root Dockerfile. This file is now the only thing in
# the repo that bumps a base image (Factory#436).
#
# How the gap happened. renovate.json came in with the fork from TFactory on
# 2026-06-03, describing exactly this policy -- pinDigests, a dockerfile manager,
# a digest rule labelled base-image -- and never once acted on it. The Renovate
# GitHub App is not installed on this account: zero Renovate PRs exist across all
# five Factory repos, and no Dependency Dashboard issue was ever opened despite
# ":dependencyDashboard" being configured. The base-image digests it claimed to
# track were tracked by nothing, which is why the frontend stage sat on a
# Chainguard digest until upstream garbage-collected it and the docker acceptance
# gate could no longer start a build (#393, AIFactory#1091 -- the identical dead
# digest was pinned in both repos).
#
# Docker-only on purpose: that is the lane that actually broke, and a narrow
# config is one that does not get switched off again the first time a weekly
# all-ecosystem run opens nine PRs at once, which is how routine updates were
# lost in the first place (AIFactory#34).
#
# Daily, not weekly. A digest pin rots in one direction only, and the gate is
# hard-down for the whole window between upstream moving and the bump landing.
#
# Verified 2026-07-30 with dependabot-cli v1.91.0 against this repo: the docker
# updater reads `tag@sha256:` pins and proposed
#   chainguard/python latest-dev  7a568bc -> 534fb1a
# rewriting the FROM line. Same tag class that was garbage-collected in #393, so
# this covers the real failure case and not a tidier neighbour of it.
#
# Not covered, stated rather than implied: helmv3 charts, github-actions SHA
# pinning, and `COPY --from=<image>` pins -- Dependabot's Dockerfile parser only
# reads FROM. None of those were covered before either; this just stops the
# config from claiming they were. If the Renovate App is ever installed, delete
# this file rather than let two bots rewrite the same FROM lines.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: daily
    labels:
      - dependencies
      - docker
      - base-image
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
