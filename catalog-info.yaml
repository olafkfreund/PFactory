apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: pfactory-mcp
  title: PFactory MCP Control Plane
  description: >-
    stdio JSON-RPC MCP server (name "pfactory") exposing the pipeline as
    mcp__pfactory__* tools for Claude Code and other agents.
  annotations:
    backstage.io/source-location: url:https://github.com/olafkfreund/PFactory/tree/main/apps/backend/mcp_server/
  tags:
    - mcp
    - jsonrpc
spec:
  type: mcp
  lifecycle: experimental
  owner: olafkfreund
  definition: |
    PFactory MCP control plane (Model Context Protocol over stdio JSON-RPC).

    Server name: "pfactory"
    Launch:      scripts/start-pfactory-mcp.sh  (referenced by repo-root .mcp.json)
    Entrypoint:  apps/backend/mcp_server/pfactory_server.py

    Environment:
      PFACTORY_PROJECT_DIR        repo root (set by Claude Code)
      PFACTORY_SPEC_DIR / --spec-dir   active spec directory (re-read per call)
      PFACTORY_API_URL            default http://localhost:3114
      PFACTORY_API_TOKEN_FILE     default ~/.pfactory/.token

    Tools are namespaced mcp__pfactory__* and assembled per session from the
    subtask, progress, memory and QA tool factories
    (apps/backend/agents/tools_pkg/registry.py).
