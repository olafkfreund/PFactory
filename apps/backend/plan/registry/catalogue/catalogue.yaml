# Seed registry catalogue — provider MCP servers, templates, and skills.
# Built-in infra adapters / knowledge connectors are auto-discovered (not listed).
entries:
  - id: provider:aws
    kind: provider
    title: AWS best-practice MCP
    capabilities: [best-practice, well-architected, read-only]
    enabled: true
  - id: provider:azure
    kind: provider
    title: Azure best-practice MCP
    capabilities: [best-practice, azure-policy, read-only]
    enabled: true
  - id: provider:gcp
    kind: provider
    title: GCP best-practice MCP
    capabilities: [best-practice, org-policy, read-only]
    enabled: true
  - id: provider:terraform
    kind: provider
    title: HashiCorp Terraform MCP (Checkov/tfsec)
    capabilities: [iac, checkov, tfsec, read-only]
    enabled: true
  - id: template:gcp-project
    kind: template
    title: GCP project (scaffold + policy)
    capabilities: [scaffold, policy, gcp]
    enabled: true
  # Skills (kind: skill) — the first entries in this lane. The skill files
  # themselves are auto-indexed from skills/<category>/ by the skills service
  # (/api/pfactory/skills and the .well-known agent-skills manifest); these
  # rows make them discoverable over /api/plan/registry alongside providers
  # and templates. config.path locates the file for any future consumer.
  - id: skill:privacy-and-regulatory
    kind: skill
    title: Privacy and regulatory implementation
    capabilities: [privacy, gdpr, retention, age-assurance, compliance-block]
    enabled: true
    config:
      path: skills/engineering/privacy-and-regulatory.md
  - id: skill:mobile-native
    kind: skill
    title: Native mobile engineering
    capabilities: [mobile, ios, android, store-review, accessibility, release]
    enabled: true
    config:
      path: skills/engineering/mobile-native.md
