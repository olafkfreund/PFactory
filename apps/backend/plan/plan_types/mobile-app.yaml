name: mobile-app
title: Mobile application (iOS / Android)
category: mobile
applies_to: [software]
# No "expo": the loader substring-matches keywords, and "expo" hits "exposes"
# — every backend spec that "exposes an API" would score a phantom mobile point.
match_keywords: [mobile, ios, android, swift, kotlin, app store, play store, react native, flutter, push notification, mobile app]
stages:
  decompose: true
  synthesize_testing: true
  synthesize_cicd: true
  code_gates: true
  review: true
