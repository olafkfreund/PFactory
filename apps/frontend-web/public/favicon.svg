<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PFactory mark">
  <title>PFactory — Plan Factory</title>
  <defs>
    <linearGradient id="pfBg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#pfBg)"/>

  <!-- decomposition flow: one plan node -> three governed work items -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" stroke-opacity="0.92">
    <path d="M44 64 H62"/>
    <path d="M62 64 C74 64 74 40 86 40"/>
    <path d="M62 64 H86"/>
    <path d="M62 64 C74 64 74 88 86 88"/>
  </g>

  <!-- source plan node (stacked doc) -->
  <rect x="24" y="48" width="22" height="32" rx="5" fill="#FFFFFF"/>

  <!-- three child work-items (epic -> children) -->
  <rect x="82" y="30" width="18" height="18" rx="5" fill="#FFFFFF"/>
  <rect x="82" y="55" width="18" height="18" rx="5" fill="#FFFFFF"/>
  <rect x="82" y="80" width="18" height="18" rx="5" fill="#FFFFFF"/>

  <!-- governance "approved" check on the middle (gate passed) -->
  <circle cx="91" cy="64" r="11" fill="#22C55E"/>
  <path d="M86 64.5 L90 68.5 L96.5 60.5" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
