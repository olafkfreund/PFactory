# PFactory ruff config.
#
# Adopts the Factory fleet shared lint baseline (the explicit select set in
# standards/coding-standards.md section 1.1). The baseline is vendored, pinned to
# the hub at standards/ruff.toml — see standards/README.md. Per the standard,
# services may only TIGHTEN, never loosen, so this file does NOT re-open any of
# the previously ignored categories.
#
# Enforcement model (coding-standards.md sections 0 and 4.6): the full strict
# select set is governed here and enforced diff-scoped via the RATCHET CI job
# (ruff on the PR's changed files only). A whole-repo blocking strict gate is
# intentionally deferred — the legacy violation count would make it instantly
# red; legacy is fixed on touch under the ratchet. A whole-repo
# `ruff format --check` IS blocking.

extend = "standards/ruff.toml"

# isort first-party detection (#254). The ratchet (scripts/ratchet_lint.py) checks
# each changed file from a TEMP path, where ruff can no longer infer that `server`
# (apps/web-server) or `plan`/`agents`/`core`/… (apps/backend) are first-party from
# the directory layout — so it groups `from server.X import …` with third-party and
# demands a different import order than the in-package gates, producing a spurious
# net-new I001 on brand-new shared modules. Pinning `src` to the app roots makes
# first-party detection CONFIG-driven (resolved relative to this file, so it holds
# from any cwd or temp path), keeping the ratchet and the in-package gates in
# agreement and unblocking the extract-to-a-new-module pattern (epic #154).
src = ["apps/backend", "apps/web-server"]

# The factory-github VCS-client layer under apps/backend/runners/github/ is a
# VENDORED MIRROR of the Factory hub canonical (shared/factory-github/,
# Factory#157). Its formatting is owned by the hub (the hub formats it at the
# fleet root width of 88; PFactory's adopted standards baseline is 100), and its
# byte-exact fidelity is enforced by .github/workflows/factory-github-drift.yml,
# NOT by the local linter/formatter. Exclude exactly the 8 canonical files (the
# service-specific files alongside them stay gated) so the local
# `ruff format --check` cannot fight the drift gate. Do NOT edit these files to
# satisfy ruff — fix the hub canonical and re-vendor (see the drift workflow).
extend-exclude = [
    # Byte-exact mirror of the Factory hub canonical scripts/ratchet_helpers.py,
    # kept identical by the verification-core drift gate. The hub formats at 100;
    # letting the local formatter touch it would silently break byte-exactness
    # and the next re-vendor (Factory#403).
    "scripts/ratchet_helpers.py",
    "apps/backend/runners/github/gh_client.py",
    "apps/backend/runners/github/rate_limiter.py",
    "apps/backend/runners/github/providers/__init__.py",
    "apps/backend/runners/github/providers/protocol.py",
    "apps/backend/runners/github/providers/factory.py",
    "apps/backend/runners/github/providers/github_provider.py",
    "apps/backend/runners/github/providers/gitlab_provider.py",
    "apps/backend/runners/github/providers/azure_devops_provider.py",
    # Factory#370 grew the canonical from 8 files to 10; these two arrived with
    # the token-authenticated GitHub provider and are vendored on the same terms.
    "apps/backend/runners/github/providers/_github_json.py",
    "apps/backend/runners/github/providers/http_github_provider.py",
    # RFC-0016 #190: the shared S3-compatible artifact-store client, vendored
    # byte-exact from the Factory hub canonical (scripts/artifact_store.py).
    # Formatted at the hub width (100); excluded here so the local
    # linter/formatter (and the ratchet, which honours these excludes) cannot
    # fight a byte-exact re-vendor. Edit the hub canonical, not this copy.
    "apps/backend/runners/artifact_store.py",
    # RFC-0014: same deal — byte-exact mirror of the hub canonical
    # scripts/cost_router_core.py at the hub width (100). It was vendored but
    # never excluded, so the local formatter could silently break a byte-exact
    # re-vendor (Factory#400).
    "apps/backend/plan/emit/cost_router_core.py",
]

[lint.per-file-ignores]
# NOTE: ruff `extend` does not deep-merge per-file-ignores; defining this table
# here replaces the baseline's table, so the shared test carve-outs are repeated
# verbatim below. Tighten-only: add narrower entries, never widen the baseline.
"**/test_*.py" = ["S101", "PLR2004"]
"**/*_test.py" = ["S101", "PLR2004"]
"**/tests/**" = ["S101", "PLR2004"]
"__init__.py" = ["F401"]  # re-export surface in package __init__ files
