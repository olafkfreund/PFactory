; PFactory mypy config. Inherits the Factory fleet shared strict baseline
; (vendored at standards/mypy.ini, pinned to the hub — see standards/README.md).
; Per the standard, services may only TIGHTEN, never loosen.
;
; This config is consumed by the diff-scoped RATCHET CI job (mypy on changed
; files only). A whole-package `mypy --strict` gate is intentionally NOT yet
; blocking, because the legacy violation count would make it instantly red; it
; is fixed on touch under the ratchet (coding-standards.md sections 0 and 4.6).

[mypy]
python_version = 3.11
strict = True
; strict implies the following; spelled out so the contract is visible and a
; service cannot quietly weaken one of them:
disallow_untyped_defs = True
disallow_any_generics = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
no_implicit_reexport = True
disallow_subclassing_any = True
extra_checks = True

; Surface, don't hide, missing third-party stubs in the diff-scoped gate.
ignore_missing_imports = True
