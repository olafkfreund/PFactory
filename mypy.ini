; PFactory mypy config. Inherits the Factory fleet shared strict baseline
; (vendored at standards/mypy.ini, pinned to the hub — see standards/README.md).
; Per the standard, services may only TIGHTEN, never loosen.
;
; This is the config a bare `mypy` picks up at the repo root, i.e. what a
; developer or an editor gets locally. The diff-scoped RATCHET CI job reads
; standards/mypy.ini directly (ratchet_lint.MYPY_CONFIG_DEFAULT), so keep the two
; in step. A whole-package `mypy --strict` gate is intentionally NOT yet blocking,
; because the legacy violation count would make it instantly red; it is fixed on
; touch under the ratchet (coding-standards.md sections 0 and 4.6).

[mypy]
; 3.12, not the baseline's fleet FLOOR of 3.11 (coding-standards.md section 1,
; "Python (3.11+)"): this repo's venv IS 3.12, and numpy's stubs in it use PEP 695
; `type` statements that mypy will not parse when told to target 3.11 — it exits 2
; having checked nothing (issue #467). Tightening the declared target to the
; interpreter in use; every strict flag below is unchanged.
python_version = 3.12
strict = True
; strict implies the following; spelled out so the contract is visible and a
; service cannot quietly weaken one of them:
disallow_untyped_defs = True
disallow_any_generics = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
no_implicit_reexport = True
disallow_subclassing_any = True
extra_checks = True

; Surface, don't hide, missing third-party stubs in the diff-scoped gate.
ignore_missing_imports = True
