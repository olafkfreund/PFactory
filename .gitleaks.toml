title = "gitleaks config for PFactory"

[extend]
useDefault = true

[allowlist]
description = "Known false positives: test fixtures and documentation examples, not real secrets"
paths = [
  # scan_secrets.py is a PFactory product feature that scans code the factory
  # generates for secrets; its test suite intentionally embeds fake secret
  # patterns (fake AWS keys, fake stripe keys, fake JWTs, etc.) as fixtures to
  # verify the detector's own pattern matching. These are not real credentials.
  '''tests/test_scan_secrets\.py''',
  '''tests/test_security_scanner\.py''',
  '''tests/test_skills_service\.py''',
  # Documentation using placeholder tokens (YOUR_TOKEN, acw_your_token) in
  # curl/websocket example commands, not real credentials.
  '''apps/web-server/README\.md''',
  '''guides/api-tokens\.md''',
  # AI prompt template containing an example finding/diff used to teach the
  # PR-review agent what a hardcoded-secret finding looks like; the value is
  # a fabricated illustrative string, not a real key.
  '''apps/backend/prompts/github/pr_followup\.md''',
  # tests/test_secrets_egress.py feeds credential-shaped strings to
  # scrub_patterns()/redaction helpers so the redactor under test has something
  # to redact -- e.g. `api_key = "..."` asserted to be absent from the output.
  # Not real credentials. Found because the scheduled full-history scan has
  # failed on every run it has ever had (3/3) and blocked nothing, a scheduled
  # gate having no PR to turn red.
  '''tests/test_secrets_egress\.py''',
]
