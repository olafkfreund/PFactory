{{- /*
App data directory PVC (/home/nonroot/.pfactory, #1116 B2c).

Created only when ``persistence.data.enabled: true`` and no
``persistence.data.existingClaim`` is provided.
*/}}
{{- if and .Values.persistence.data.enabled (not .Values.persistence.data.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pfactory.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pfactory.labels" . | nindent 4 }}
    app.kubernetes.io/component: data
spec:
  accessModes:
    - {{ .Values.persistence.data.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size | default "1Gi" | quote }}
  {{- if .Values.persistence.data.storageClass }}
  storageClassName: {{ .Values.persistence.data.storageClass | quote }}
  {{- end }}
{{- end }}
